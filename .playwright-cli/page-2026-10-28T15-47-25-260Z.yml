    - paragraph [ref=f1e34]: מסד בדיקה נפרד עם נתוני דמה בלבד. אין כאן העתק של ביקורות משתמשים, אין מפתחות מהמסד הפעיל ולא נוצר משאב ענן בתשלום.
  - heading "גם ההרשאות נבדקו" [level=2] [ref=f1e35]
  - paragraph [ref=f1e36]: הפונקציה והמונה אינם נגישים לתפקידים הציבוריים. לאחר שינוי ההרשאות בסביבת הבדיקה, כתיבה ישירה משני התפקידים הציבוריים נחסמה, ושליחה דרך תפקיד השרת המשיכה לעבוד.
  - heading "מה עדיין לא הופעל" [level=2] [ref=f1e37]
  - paragraph [ref=f1e38]: ההגנה באתר החי עדיין כבויה. לפני הפעלה נדרשים חיבור מאובטח ל-Supabase ול-Vercel, בדיקה של המסלול דרך שירות ה-REST, פריסה מתואמת ואישור לשינוי הרשאות הכתיבה במסד הפעיל.
